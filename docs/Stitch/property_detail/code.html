<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Edit Property</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#201c00",
                        "surface-container-low": "#1f1a21",
                        "on-secondary-container": "#e2a2ed",
                        "inverse-surface": "#eadfea",
                        "on-primary-container": "#450069",
                        "on-primary-fixed-variant": "#6b1a9a",
                        "primary-container": "#bd6fec",
                        "surface": "#171219",
                        "surface-container-lowest": "#110c14",
                        "on-tertiary": "#373100",
                        "secondary-container": "#693376",
                        "surface-variant": "#39333b",
                        "on-secondary-fixed-variant": "#663073",
                        "on-background": "#eadfea",
                        "tertiary-fixed-dim": "#dac84e",
                        "outline-variant": "#4d4351",
                        "surface-dim": "#171219",
                        "error-container": "#93000a",
                        "on-secondary": "#4d185b",
                        "surface-container": "#231e25",
                        "on-error-container": "#ffdad6",
                        "tertiary": "#dac84e",
                        "outline": "#998d9d",
                        "inverse-primary": "#8639b4",
                        "on-tertiary-fixed-variant": "#504700",
                        "secondary": "#f2affc",
                        "on-secondary-fixed": "#340042",
                        "surface-bright": "#3d373f",
                        "on-primary-fixed": "#30004b",
                        "secondary-fixed": "#fdd6ff",
                        "surface-container-highest": "#39333b",
                        "on-surface-variant": "#d0c2d3",
                        "background": "#171219",
                        "primary-fixed": "#f5d9ff",
                        "surface-tint": "#e5b4ff",
                        "primary": "#e5b4ff",
                        "error": "#ffb4ab",
                        "on-primary": "#4f0077",
                        "surface-container-high": "#2e2830",
                        "secondary-fixed-dim": "#f2affc",
                        "on-surface": "#eadfea",
                        "on-error": "#690005",
                        "tertiary-fixed": "#f7e467",
                        "on-tertiary-container": "#484000",
                        "primary-fixed-dim": "#e5b4ff",
                        "tertiary-container": "#bdac35",
                        "inverse-on-surface": "#342e37"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inner-padding": "12px",
                        "container-margin": "20px",
                        "section-padding": "32px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "h2": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "h3": ["Manrope"],
                        "h1": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom input focus ring overriding default tailwind forms */
        input:focus, textarea:focus {
            box-shadow: none !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg antialiased h-[884px] flex flex-col relative overflow-hidden">
<!-- Transactional Top Bar (Suppresses Main Nav Shell per Destination Rule) -->
<header class="flex items-center justify-between h-16 px-container-margin shrink-0 bg-background/80 backdrop-blur-xl z-50 border-b border-white/5">
<button class="w-10 h-10 flex items-center justify-start text-on-surface hover:text-primary-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-h2 font-h2">arrow_back</span>
</button>
<h1 class="text-h3 font-h3 font-bold text-on-surface">Add Property</h1>
<div class="w-10"></div> <!-- Centering spacer -->
</header>
<!-- Scrollable Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin py-section-padding pb-32 hide-scrollbar relative">
<!-- Background Ambient Glow -->
<div class="absolute top-0 right-0 w-[300px] h-[300px] bg-primary-container/10 blur-[100px] rounded-full pointer-events-none -z-10"></div>
<form class="space-y-section-padding">
<!-- Core Details Group -->
<div class="space-y-stack-gap">
<!-- Input: Property Label -->
<div class="space-y-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Property Name</label>
<div class="bg-surface-container/60 backdrop-blur-[16px] rounded-xl border-t border-l border-white/10 border-b border-outline focus-within:border-b-primary-container focus-within:border-b-2 transition-all shadow-[0_8px_32px_rgba(0,0,0,0.2)]">
<input class="w-full bg-transparent border-none text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0 px-4 py-4 rounded-xl" placeholder="e.g. Mountain Retreat" type="text"/>
</div>
</div>
<!-- Input: Address Autocomplete (Mocked) -->
<div class="space-y-2 relative z-20">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Address</label>
<div class="bg-surface-container/60 backdrop-blur-[16px] rounded-xl border-t border-l border-white/10 border-b border-primary-container border-b-2 transition-all flex items-center pr-4 shadow-[0_8px_32px_rgba(0,0,0,0.2)]">
<input autocomplete="off" class="w-full bg-transparent border-none text-body-lg font-body-lg text-on-surface focus:ring-0 px-4 py-4 rounded-xl" type="text" value="123 Summit"/>
<span class="material-symbols-outlined text-primary-container">search</span>
</div>
<!-- Autocomplete Dropdown Mock (Glassmorphism) -->
<div class="absolute top-full left-0 right-0 mt-2 bg-surface-container-high/80 backdrop-blur-2xl rounded-xl border border-white/10 shadow-[0_16px_40px_rgba(0,0,0,0.4)] overflow-hidden">
<div class="flex items-center gap-4 px-4 py-3 hover:bg-white/5 active:bg-white/10 transition-colors border-b border-white/5 cursor-pointer">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container text-[18px]">location_on</span>
</div>
<div>
<div class="text-body-lg font-body-lg text-on-surface font-medium">123 Summit Avenue</div>
<div class="text-body-sm font-body-sm text-on-surface-variant">Aspen, CO 81611</div>
</div>
</div>
<div class="flex items-center gap-4 px-4 py-3 hover:bg-white/5 active:bg-white/10 transition-colors cursor-pointer">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-outline text-[18px]">location_on</span>
</div>
<div>
<div class="text-body-lg font-body-lg text-on-surface">123 Summit Ridge Drive</div>
<div class="text-body-sm font-body-sm text-on-surface-variant">Denver, CO 80202</div>
</div>
</div>
</div>
</div>
<!-- Input: Property Type Horizontal Picker -->
<div class="space-y-3 pt-2 relative z-10">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Property Type</label>
<div class="flex gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-container-margin px-container-margin hide-scrollbar">
<!-- Active Chip -->
<button class="snap-start shrink-0 px-5 py-3 rounded-full bg-primary-container/20 border border-primary-container/50 text-primary-container text-body-sm font-body-sm font-bold flex items-center gap-2 backdrop-blur-md transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">house</span>
                            House
                        </button>
<!-- Inactive Chips -->
<button class="snap-start shrink-0 px-5 py-3 rounded-full bg-surface-container/40 border border-white/10 border-t-white/20 text-on-surface-variant text-body-sm font-body-sm hover:bg-white/5 flex items-center gap-2 backdrop-blur-md transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px]">apartment</span>
                            Apartment
                        </button>
<button class="snap-start shrink-0 px-5 py-3 rounded-full bg-surface-container/40 border border-white/10 border-t-white/20 text-on-surface-variant text-body-sm font-body-sm hover:bg-white/5 flex items-center gap-2 backdrop-blur-md transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px]">domain</span>
                            Office
                        </button>
<button class="snap-start shrink-0 px-5 py-3 rounded-full bg-surface-container/40 border border-white/10 border-t-white/20 text-on-surface-variant text-body-sm font-body-sm hover:bg-white/5 flex items-center gap-2 backdrop-blur-md transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-[20px]">villa</span>
                            Villa
                        </button>
</div>
</div>
</div>
<!-- Optional Details Group -->
<div class="space-y-stack-gap pt-6 border-t border-white/5 relative z-0">
<div class="flex items-baseline gap-2 mb-2">
<h2 class="text-h3 font-h3 font-semibold text-on-surface">Access Details</h2>
<span class="text-body-sm font-body-sm text-outline">(Optional)</span>
</div>
<!-- Input: Gate Code -->
<div class="space-y-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Gate Code</label>
<div class="bg-surface-container/60 backdrop-blur-[16px] rounded-xl border-t border-l border-white/10 border-b border-outline focus-within:border-b-primary-container focus-within:border-b-2 transition-all flex items-center shadow-sm">
<div class="pl-4 pr-2 text-outline-variant"><span class="material-symbols-outlined text-[20px]">key</span></div>
<input class="w-full bg-transparent border-none text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0 py-4 pr-4 rounded-xl" placeholder="#1234" type="text"/>
</div>
</div>
<!-- Input: Access Notes -->
<div class="space-y-2">
<label class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-wider pl-1">Access Notes</label>
<div class="bg-surface-container/60 backdrop-blur-[16px] rounded-xl border-t border-l border-white/10 border-b border-outline focus-within:border-b-primary-container focus-within:border-b-2 transition-all shadow-sm">
<textarea class="w-full bg-transparent border-none text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0 px-4 py-4 resize-none rounded-xl" placeholder="e.g. Key is located under the mat..." rows="3"></textarea>
</div>
</div>
<!-- Toggle: Primary Property -->
<div class="flex items-center justify-between p-5 bg-surface-container/40 backdrop-blur-[16px] rounded-2xl border border-white/10 border-t-white/20 mt-4 shadow-lg">
<div>
<div class="text-body-lg font-body-lg text-on-surface font-semibold mb-1">Primary Property</div>
<div class="text-body-sm font-body-sm text-on-surface-variant">Set as default for new bookings</div>
</div>
<!-- Custom Glass Toggle (Active State) -->
<div class="w-14 h-7 bg-primary-container/30 rounded-full relative cursor-pointer border border-primary-container/50 transition-colors shrink-0">
<div class="w-6 h-6 bg-primary-container rounded-full absolute top-[1px] right-[2px] shadow-[0_2px_8px_rgba(189,111,236,0.6)] transition-all"></div>
</div>
</div>
</div>
</form>
</main>
<!-- Sticky Footer (Full Width Action) -->
<div class="absolute bottom-0 left-0 w-full p-container-margin bg-background/80 backdrop-blur-[24px] border-t border-white/5 pb-[calc(20px+env(safe-area-inset-bottom))] z-40">
<button class="w-full bg-gradient-to-r from-primary-container to-secondary-container text-on-primary-container text-h3 font-h3 py-4 rounded-xl font-bold shadow-[0_8px_24px_-4px_rgba(189,111,236,0.4)] active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="button">
            Save Property
        </button>
</div>
</body></html>
