<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumina - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#f7e467",
                        "on-error": "#690005",
                        "tertiary-container": "#bdac35",
                        "inverse-on-surface": "#342e37",
                        "primary-fixed-dim": "#e5b4ff",
                        "on-tertiary-container": "#484000",
                        "surface-tint": "#e5b4ff",
                        "primary": "#e5b4ff",
                        "error": "#ffb4ab",
                        "primary-fixed": "#f5d9ff",
                        "surface-container-high": "#2e2830",
                        "secondary-fixed-dim": "#f2affc",
                        "on-surface": "#eadfea",
                        "on-primary": "#4f0077",
                        "surface-bright": "#3d373f",
                        "on-primary-fixed": "#30004b",
                        "secondary": "#f2affc",
                        "on-secondary-fixed": "#340042",
                        "surface-container-highest": "#39333b",
                        "on-surface-variant": "#d0c2d3",
                        "background": "#171219",
                        "secondary-fixed": "#fdd6ff",
                        "outline": "#998d9d",
                        "inverse-primary": "#8639b4",
                        "on-tertiary-fixed-variant": "#504700",
                        "on-secondary": "#4d185b",
                        "tertiary": "#dac84e",
                        "surface-container": "#231e25",
                        "on-error-container": "#ffdad6",
                        "on-background": "#eadfea",
                        "surface-variant": "#39333b",
                        "on-secondary-fixed-variant": "#663073",
                        "secondary-container": "#693376",
                        "error-container": "#93000a",
                        "surface-dim": "#171219",
                        "tertiary-fixed-dim": "#dac84e",
                        "outline-variant": "#4d4351",
                        "on-primary-fixed-variant": "#6b1a9a",
                        "surface-container-lowest": "#110c14",
                        "on-tertiary": "#373100",
                        "surface": "#171219",
                        "primary-container": "#bd6fec",
                        "surface-container-low": "#1f1a21",
                        "on-tertiary-fixed": "#201c00",
                        "on-primary-container": "#450069",
                        "on-secondary-container": "#e2a2ed",
                        "inverse-surface": "#eadfea",
                        "brand-accent": "#AC5FDB",
                        "splash-bg": "#29262B"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "inner-padding": "12px",
                        "stack-gap": "16px",
                        "section-padding": "32px"
                    },
                    "fontFamily": {
                        "body-sm": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "h3": ["Manrope"],
                        "h1": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "h2": ["Manrope"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Spinner CSS */
        .spinner {
            border: 3px solid rgba(172, 95, 219, 0.2);
            border-top: 3px solid #AC5FDB;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-splash-bg text-on-surface min-h-screen flex items-center justify-center overflow-hidden font-body-sm relative selection:bg-brand-accent selection:text-white">
<!-- Decorative Ambient Glows -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] rounded-full bg-brand-accent/10 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-0 right-0 translate-x-1/3 translate-y-1/3 w-[60vw] h-[60vw] max-w-[400px] max-h-[400px] rounded-full bg-secondary-container/20 blur-[80px] pointer-events-none"></div>
<main class="relative z-10 flex flex-col items-center justify-center p-container-margin w-full max-w-md">
<!-- Logo Container -->
<div class="flex flex-col items-center justify-center mb-section-padding">
<!-- Glassmorphism Ring around Icon -->
<div class="relative flex items-center justify-center w-32 h-32 rounded-full bg-[#3C3541]/40 backdrop-blur-[16px] border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.4)] mb-stack-gap">
<!-- Inner glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-transparent to-white/5 pointer-events-none"></div>
<!-- Icon -->
<span class="material-symbols-outlined text-[64px] text-brand-accent drop-shadow-[0_0_15px_rgba(172,95,219,0.5)]">bolt</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface tracking-tight">LUMINA</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-2 tracking-[0.2em] opacity-80">Initializing Core</p>
</div>
<!-- Activity Indicator Section -->
<div class="flex flex-col items-center justify-center h-24" id="loading-state">
<div class="spinner"></div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-4 opacity-70">Authenticating connection...</p>
</div>
<!-- Failure State (Hidden by default, shown for demonstration of design) -->
<!-- To view this state, add 'hidden' to the div above and remove 'hidden' below -->
<div class="hidden flex-col items-center justify-center w-full mt-4" id="error-state">
<div class="px-6 py-4 rounded-xl bg-error-container/20 border border-error/20 backdrop-blur-md flex flex-col items-center text-center mb-6 w-full max-w-[280px]">
<span class="material-symbols-outlined text-error mb-2">wifi_off</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Connection could not be established.</p>
</div>
<button class="px-8 py-3 rounded-full bg-transparent border border-brand-accent/50 text-brand-accent font-body-sm text-body-sm font-semibold hover:bg-brand-accent/10 transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Retry Connection
            </button>
</div>
</main>
<!-- Suppressed TopAppBar and BottomNavBar as per Semantic Shell Mandate for Transactional/Splash Screens -->
</body></html>
