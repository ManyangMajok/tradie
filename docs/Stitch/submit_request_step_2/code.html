<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Submit Request Wizard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "on-surface-variant": "#d0c2d3",
                        "on-surface": "#eadfea",
                        "tertiary-container": "#bdac35",
                        "primary-fixed": "#f5d9ff",
                        "surface-tint": "#e5b4ff",
                        "outline-variant": "#4d4351",
                        "on-secondary": "#4d185b",
                        "surface-container-highest": "#39333b",
                        "on-tertiary": "#373100",
                        "primary": "#e5b4ff",
                        "on-secondary-fixed-variant": "#663073",
                        "on-error": "#690005",
                        "on-background": "#eadfea",
                        "inverse-surface": "#eadfea",
                        "on-tertiary-container": "#484000",
                        "on-primary-fixed-variant": "#6b1a9a",
                        "surface-variant": "#39333b",

                        "container-margin": "20px",
                        "section-padding": "32px",
                        "stack-gap": "16px",
                        "inner-padding": "12px"
                    },
                    "fontFamily": {
                        "h1": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "h3": ["Manrope"],
                        "h2": ["Manrope"],
                        "body-sm": ["Manrope"]

                    "fontSize": {
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-lg min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-zinc-900/80 backdrop-blur-xl docked full-width border-b border-white/10 shadow-none">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-white text-lg font-extrabold" data-icon="close">close</span>
</button>
<h1 class="font-['Manrope'] text-sm tracking-wide uppercase font-bold text-white">Service Request</h1>
<div class="px-2">
<span class="text-[#AC5FDB] font-['Manrope'] text-sm tracking-wide uppercase font-bold">Step 1 of 7</span>
</div>
</header>
<!-- Main Content -->
<main class="pt-24 pb-[120px] px-container-margin">
<div class="mb-stack-gap">
<h2 class="font-h2 text-h2 text-on-surface mb-2">Select Category</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Choose the primary issue for your service request.</p>
</div>
<div class="grid grid-cols-2 gap-stack-gap">
<!-- Card 1 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="plumbing">plumbing</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Plumbing</span>
</button>
<!-- Card 2 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="electrical_services">electrical_services</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Electrical</span>
</button>
<!-- Card 3 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="hvac">hvac</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">HVAC</span>
</button>
<!-- Card 4 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="carpentry">carpenter</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Carpentry</span>
</button>
<!-- Card 5 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="format_paint">format_paint</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Painting</span>
</button>
<!-- Card 6 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="roofing">roofing</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Roofing</span>
</button>
<!-- Card 7 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="forest">forest</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Landscaping</span>
</button>
<!-- Card 8 -->
<button class="group flex flex-col items-center justify-center p-6 rounded-2xl bg-[#3C3541]/70 backdrop-blur-[16px] border-t border-l border-white/15 hover:bg-white/10 transition-all active:scale-95 duration-200 focus:outline-none focus:ring-2 focus:ring-primary">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="pest_control">pest_control</span>
</div>
<span class="font-h3 text-[16px] text-on-surface">Pest Control</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-8 pt-4 bg-[#3C3541]/90 backdrop-blur-2xl docked full-width rounded-t-2xl border-t border-white/15 shadow-2xl">
<button class="flex flex-col items-center justify-center text-zinc-400 opacity-60 px-8 py-2 hover:opacity-100 transition-opacity active:scale-98 duration-200">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="arrow_back">arrow_back</span>
<span class="font-['Manrope'] text-[10px] font-semibold uppercase tracking-widest">Back</span>
</button>
<button class="flex flex-col items-center justify-center bg-gradient-to-br from-[#AC5FDB] to-[#E3A2EE] text-white rounded-xl px-8 py-2 hover:opacity-100 transition-opacity active:scale-98 duration-200 shadow-lg shadow-[#AC5FDB]/20">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="arrow_forward">arrow_forward</span>
<span class="font-['Manrope'] text-[10px] font-semibold uppercase tracking-widest">Next</span>
</button>
</footer>
</body></html>
