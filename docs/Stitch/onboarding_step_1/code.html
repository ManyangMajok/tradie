<!-- TopAppBar from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-end items-center px-6 py-4 bg-transparent flat no shadows docked full-width top-0">
<button class="font-manrope font-semibold text-sm tracking-wide text-purple-400 dark:text-purple-300 hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
            Skip
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin pt-24 pb-section-padding relative z-10">
<!-- Background Blur Decor (Optional, to enhance the dark glass aesthetic) -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-container opacity-20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-secondary-container opacity-20 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Glassmorphic Card -->
<div class="glass-panel rounded-xl w-full max-w-sm flex flex-col items-center p-section-padding text-center relative z-20">
<!-- Large Icon Container -->
<div class="w-24 h-24 rounded-full bg-primary-container/20 flex items-center justify-center mb-stack-gap border border-primary/30 shadow-[0_0_30px_rgba(189,111,236,0.3)]">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                    notifications_active
                </span>
</div>
<!-- Content -->
<h1 class="font-h1 text-h1 text-on-surface mb-inner-padding">
                Leads arrive fast
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-section-padding">
                Enable push notifications to get instantly alerted when new high-quality leads match your criteria. Never miss an opportunity.
            </p>
<!-- Primary CTA -->
<button class="w-full bg-gradient-primary rounded-lg py-4 px-6 font-h3 text-h3 text-white hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary-container/30">
                Enable notifications
            </button>
</div>
</main>
