<!DOCTYPE html>

                        "on-secondary": "#4d185b",
                        "surface-dim": "#171219",

<body class="bg-surface-container-high text-on-surface antialiased min-h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-transparent fixed top-0 left-0 w-full z-50 flex justify-end items-center px-6 py-4 docked full-width top-0">
<button class="font-manrope font-semibold text-sm tracking-wide text-purple-400 dark:text-purple-300 hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin pt-24 pb-section-padding w-full max-w-md mx-auto relative z-10">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 z-[-1] overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/10 rounded-full blur-[80px]"></div>
</div>
<!-- Glassmorphic Card -->
<div class="w-full flex flex-col items-center gap-section-padding backdrop-blur-[16px] bg-[#3C3541]/70 border-t border-l border-white/15 rounded-[24px] p-section-padding shadow-2xl relative overflow-hidden">
<!-- Icon Container -->
<div class="w-24 h-24 rounded-full flex items-center justify-center bg-surface-container-lowest/50 border border-white/10 shadow-[inset_0_0_20px_rgba(255,255,255,0.05)]">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="date_range" style="font-variation-settings: 'FILL' 1;">date_range</span>
</div>
<!-- Text Content -->
<div class="text-center flex flex-col gap-inner-padding">
<h1 class="font-h1 text-h1 text-on-surface">Set your availability</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                    Define when and where you operate. This helps us match you with the right opportunities in your service areas.
                </p>
</div>
<!-- Decorative Subtle Divider within Card -->
<div class="w-16 h-[1px] bg-outline-variant/50 mt-4"></div>
</div>
<!-- Bottom Navigation & Controls -->
<div class="w-full mt-auto pt-section-padding flex flex-col gap-section-padding">
<!-- Step Indicators -->
<div class="flex justify-center items-center gap-2">
<div class="w-2 h-2 rounded-full bg-on-surface-variant/30"></div>
<div class="w-2 h-2 rounded-full bg-on-surface-variant/30"></div>
<div class="w-8 h-2 rounded-full bg-primary-fixed shadow-[0_0_10px_rgba(229,180,255,0.5)]"></div>
</div>
<!-- Primary CTA Button -->
<button class="w-full py-4 rounded-full bg-gradient-to-r from-[#AC5FDB] to-[#E3A2EE] text-white font-h3 text-h3 shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-transform duration-200">
                Review my settings
            </button>
</div>
</main>
