<body class="antialiased min-h-screen flex flex-col font-body-lg pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-slate-900/80 backdrop-blur-xl border-b border-white/10 shadow-none">
<button class="text-slate-400 hover:bg-white/5 p-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-manrope font-semibold tracking-tight text-lg font-bold text-white">Leave a Review</h1>
<button class="text-purple-400 font-manrope font-semibold tracking-tight hover:bg-white/5 px-3 py-2 rounded-lg active:scale-95 transition-transform duration-200">
            Submit
        </button>
</header>
<!-- Main Content -->
<main class="flex-1 pt-24 px-container-margin pb-32">
<div class="max-w-2xl mx-auto space-y-section-padding">
<!-- Header Section -->
<section class="space-y-2">
<h2 class="font-h1 text-h1 text-on-surface">How did Elite Plumbing Solutions do?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your feedback helps them improve and helps other members make informed decisions.</p>
</section>
<!-- Star Rating Section -->
<section class="glass-card rounded-xl p-inner-padding flex flex-col items-center justify-center space-y-4 py-8">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Overall Rating</p>
<div class="flex space-x-2">
<span class="material-symbols-outlined text-5xl text-[#E3A2EE] cursor-pointer hover:scale-110 transition-transform" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-5xl text-[#E3A2EE] cursor-pointer hover:scale-110 transition-transform" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-5xl text-[#E3A2EE] cursor-pointer hover:scale-110 transition-transform" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-5xl text-[#E3A2EE] cursor-pointer hover:scale-110 transition-transform" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-5xl text-outline cursor-pointer hover:scale-110 transition-transform" data-icon="star">star</span>
</div>
</section>
<!-- Questions Form Groups -->
<section class="space-y-stack-gap">
<!-- Q1 -->
<div class="glass-card rounded-xl p-inner-padding space-y-4">
<label class="font-h3 text-h3 text-on-surface block">Was the work completed?</label>
<div class="flex bg-surface-container-lowest rounded-full p-1 border border-white/5">
<button class="flex-1 py-2 px-4 rounded-full bg-[#AC5FDB] text-white font-body-sm font-semibold transition-all">Yes</button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant font-body-sm hover:text-white transition-colors">Partially</button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant font-body-sm hover:text-white transition-colors">No</button>
</div>
</div>
<!-- Q2 -->
<div class="glass-card rounded-xl p-inner-padding space-y-4">
<label class="font-h3 text-h3 text-on-surface block">Was the call-out fee waived?</label>
<div class="flex bg-surface-container-lowest rounded-full p-1 border border-white/5">
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant font-body-sm hover:text-white transition-colors">Yes</button>
<button class="flex-1 py-2 px-4 rounded-full bg-[#AC5FDB] text-white font-body-sm font-semibold transition-all">No</button>
</div>
</div>
<!-- Q3 -->
<div class="glass-card rounded-xl p-inner-padding space-y-4">
<label class="font-h3 text-h3 text-on-surface block">Was your 10% discount applied?</label>
<div class="flex bg-surface-container-lowest rounded-full p-1 border border-white/5">
<button class="flex-1 py-2 px-4 rounded-full bg-[#AC5FDB] text-white font-body-sm font-semibold transition-all">Yes</button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant font-body-sm hover:text-white transition-colors">No</button>
<button class="flex-1 py-2 px-4 rounded-full text-on-surface-variant font-body-sm hover:text-white transition-colors">N/A</button>
</div>
</div>
</section>
<!-- Comment Field -->
<section class="glass-card rounded-xl p-inner-padding space-y-2">
<label class="font-h3 text-h3 text-on-surface block" for="review-comments">Additional Comments</label>
<textarea class="w-full bg-surface-container-lowest text-on-surface font-body-lg rounded-lg border-0 border-b border-outline focus:border-[#AC5FDB] focus:ring-0 resize-none p-4 placeholder:text-outline-variant transition-colors" id="review-comments" placeholder="Tell us more about your experience..." rows="4"></textarea>
</section>
</div>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full px-container-margin py-6 bg-gradient-to-t from-[#171219] via-[#171219]/90 to-transparent z-40">
<div class="max-w-2xl mx-auto">
<button class="w-full primary-gradient rounded-xl py-4 font-h3 text-h3 text-white font-bold shadow-lg active:scale-95 transition-transform">
                Submit Review
            </button>
</div>
</footer>
