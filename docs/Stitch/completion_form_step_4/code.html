<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[90%]">

</section>
<!-- Bento Grid for Photos -->

<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-primary-container text-2xl">add</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-primary-fixed transition-colors">Add Photo</span>
</button>
<!-- Mock Thumbnail 1 -->
<div class="aspect-square rounded-2xl overflow-hidden relative group bg-surface-container border border-white/5 shadow-lg relative">
<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="absolute top-2 right-2 z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<button class="w-8 h-8 rounded-full bg-error-container/80 backdrop-blur-md flex items-center justify-center text-on-error-container hover:bg-error transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">delete</span>

</div>
<!-- Mock Thumbnail 2 -->

<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="absolute top-2 right-2 z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-300">

</button>
</div>

<span class="material-symbols-outlined">arrow_back</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest">Back</span>
</button>
<!-- Next Action (Active Intent for Wizard) -->
