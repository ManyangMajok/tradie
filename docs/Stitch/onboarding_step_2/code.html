<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg selection:bg-primary-container selection:text-on-primary-container relative overflow-hidden">
<!-- Ambient Background Glow -->
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] max-w-2xl bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-end items-center px-6 py-4 bg-transparent flat no shadows docked full-width top-0 none">
<button class="text-purple-400 dark:text-purple-300 font-manrope font-semibold text-sm tracking-wide hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 flex items-center justify-center">
<span>Skip</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin pt-section-padding pb-[140px] relative z-10 w-full max-w-md mx-auto">
<!-- Glassmorphic Card -->
<div class="w-full relative rounded-[32px] bg-surface-container-high/70 backdrop-blur-[16px] border border-white/10 border-t-white/15 border-l-white/15 p-8 flex flex-col items-center text-center shadow-2xl">
<!-- Large Shield Icon -->
<div class="w-24 h-24 rounded-full bg-surface-container-highest/50 border border-white/5 flex items-center justify-center mb-8 shadow-inner">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    shield_lock
                </span>
</div>
<!-- Heading -->
<h2 class="font-h2 text-h2 text-on-surface mb-4">
                You're in control
            </h2>
<!-- Text -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 max-w-[280px]">
                Accept or decline incoming requests based on your availability. The power is in your hands.
            </p>
<!-- Mock Countdown UI -->
<div class="flex items-center gap-3 bg-surface-container-lowest/80 border border-outline/20 rounded-full px-5 py-3 backdrop-blur-md">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 0;">
                    timer
                </span>
<span class="font-h3 text-h3 text-on-surface tabular-nums tracking-widest">
                    02:00
                </span>
</div>
</div>
</main>
<!-- Bottom Actions & Indicators -->
<div class="fixed bottom-0 left-0 w-full z-50 p-container-margin pb-8 flex flex-col items-center gap-stack-gap bg-gradient-to-t from-background via-background/90 to-transparent">
<!-- Dot Indicators -->
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 rounded-full bg-surface-variant transition-all duration-300"></div>
<div class="w-8 h-2 rounded-full bg-primary transition-all duration-300 shadow-[0_0_8px_rgba(229,180,255,0.5)]"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-all duration-300"></div>
</div>
<!-- Primary Button -->
<button class="w-full max-w-md bg-primary-container text-on-primary-container hover:bg-primary-fixed transition-colors active:scale-[0.98] py-4 rounded-xl font-h3 text-h3 flex items-center justify-center shadow-lg">
            Next
        </button>
</div>
