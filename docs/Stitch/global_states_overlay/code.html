<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Global States Overlay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#30004b",
                        "secondary-fixed": "#fdd6ff",
                        "error-container": "#93000a",
                        "on-background": "#eadfea",
                        "on-secondary-container": "#e2a2ed",
                        "on-tertiary-fixed-variant": "#504700",
                        "primary-fixed": "#f5d9ff",
                        "on-tertiary": "#373100",
                        "surface-tint": "#e5b4ff",
                        "surface-dim": "#171219",
                        "secondary-fixed-dim": "#f2affc",
                        "error": "#ffb4ab",
                        "tertiary-container": "#bdac35",
                        "on-secondary": "#4d185b",
                        "tertiary": "#dac84e",
                        "surface-container": "#231e25",
                        "on-tertiary-fixed": "#201c00",
                        "on-tertiary-container": "#484000",
                        "on-primary-fixed-variant": "#6b1a9a",
                        "on-error": "#690005",
                        "secondary-container": "#693376",
                        "outline": "#998d9d",
                        "primary": "#e5b4ff",
                        "inverse-on-surface": "#342e37",
                        "background": "#171219",
                        "primary-container": "#bd6fec",
                        "surface-container-high": "#2e2830",
                        "on-secondary-fixed-variant": "#663073",
                        "inverse-primary": "#8639b4",
                        "surface-container-low": "#1f1a21",
                        "surface-container-highest": "#39333b",
                        "tertiary-fixed-dim": "#dac84e",
                        "on-secondary-fixed": "#340042",
                        "surface-variant": "#39333b",
                        "tertiary-fixed": "#f7e467",
                        "surface": "#171219",
                        "secondary": "#f2affc",
                        "inverse-surface": "#eadfea",
                        "on-surface-variant": "#d0c2d3",
                        "outline-variant": "#4d4351",
                        "on-surface": "#eadfea",
                        "primary-fixed-dim": "#e5b4ff",
                        "on-primary": "#4f0077",
                        "surface-bright": "#3d373f",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#450069",
                        "surface-container-lowest": "#110c14"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inner-padding": "12px",
                        "section-padding": "32px",
                        "container-margin": "20px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Manrope"],
                        "h3": ["Manrope"],
                        "h2": ["Manrope"],
                        "h1": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "label-caps": ["Manrope"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #171219; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background font-body-lg min-h-screen relative overflow-hidden">
<!-- Mock Background Content to show overlay effects -->
<div class="p-container-margin space-y-section-padding opacity-30">
<div class="h-48 bg-surface-container rounded-xl"></div>
<div class="grid grid-cols-2 gap-stack-gap">
<div class="h-32 bg-surface-container rounded-xl"></div>
<div class="h-32 bg-surface-container rounded-xl"></div>
</div>
</div>
<!-- 1. Offline Banner (Non-blocking) -->
<div class="fixed top-0 w-full z-[100] bg-amber-500 shadow-lg flex items-center justify-center h-10 px-4 w-full">
<div class="flex items-center gap-2 text-white hover:brightness-110">
<span class="material-symbols-outlined text-body-sm" data-icon="signal_disconnected">signal_disconnected</span>
<span class="font-manrope font-bold text-sm tracking-wide">System Status: Offline — showing cached leads</span>
</div>
</div>
<!-- Container for visual demonstration of the two full-screen states. 
         In a real app, only one would be visible at a time. Using grid here to show both. -->
<div class="fixed inset-0 top-10 z-[110] flex flex-col md:flex-row pointer-events-none">
<!-- 2. Session Expired (Blocking Overlay - Left half for demo) -->
<div class="flex-1 relative pointer-events-auto border-r border-white/10 md:border-r md:border-b-0 border-b">
<!-- NavigationDrawer JSON mapped -->
<div class="absolute inset-0 bg-[#3C3541]/80 dark:bg-[#29262B]/95 backdrop-blur-xl flex flex-col items-center justify-center w-full h-full gap-8 px-10">
<div class="flex flex-col items-center text-center gap-4">
<span class="material-symbols-outlined text-[#AC5FDB] text-6xl" data-icon="login">login</span>
<h2 class="font-manrope text-white font-black text-2xl">System Alert</h2>
<p class="font-body-lg text-on-surface-variant max-w-sm">Your session expired. Sign in to continue.</p>
</div>
<button class="bg-[#AC5FDB] text-white rounded-lg px-6 py-3 font-bold hover:opacity-90 transition-opacity scale-95 active:scale-100 transition-transform w-full max-w-[240px]">
                    Sign In
                </button>
</div>
</div>
<!-- 3. Maintenance Mode (Blocking Overlay - Right half for demo) -->
<div class="flex-1 relative pointer-events-auto">
<!-- NavigationDrawer JSON mapped slightly differently for visual distinction -->
<div class="absolute inset-0 bg-[#3C3541]/80 dark:bg-[#29262B]/95 backdrop-blur-xl flex flex-col items-center justify-center w-full h-full gap-8 px-10">
<div class="flex flex-col items-center text-center gap-4">
<span class="material-symbols-outlined text-[#AC5FDB] text-6xl" data-icon="build">build</span>
<h2 class="font-manrope text-white font-black text-2xl">Maintenance</h2>
<p class="font-body-lg text-on-surface-variant max-w-sm">Tradify is getting an update. Back shortly.</p>
</div>
<button class="border border-[#AC5FDB] text-[#AC5FDB] rounded-lg px-6 py-3 hover:opacity-90 transition-opacity scale-95 active:scale-100 transition-transform w-full max-w-[240px] font-bold">
                    Retry
                </button>
</div>
</div>
</div>
</body></html>
